<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where Knowledge Blossoms | CSEA Saraswathi Pooja · PSG College of Technology</title>
    <meta
      name="description"
      content="A celebratory digital tribute for Saraswathi Pooja presented by Computer Science and Engineering Association (CSEA), PSG College of Technology. Learn with curiosity. Grow with gratitude. Dream with courage."
    />
    <meta name="theme-color" content="#103624" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Where Knowledge Blossoms | CSEA Saraswathi Pooja · PSG Tech" />
    <meta property="og:description" content="Learn with curiosity. Grow with gratitude. Dream with courage. A tribute to knowledge, wisdom, and new beginnings." />
    <meta property="og:image" content="/images/ezgif-frame-001.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>" />

    <!-- High-Priority Preload for First Hero Frame (Starts immediately at 0ms) -->
    <link rel="preload" as="image" href="/images/ezgif-frame-001.jpg" fetchpriority="high" />

    <!-- Asynchronous, Non-Blocking Google Fonts (Never blocks HTML first-paint) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Critical CSS: Ensures instant layout rendering before bundle or external stylesheets arrive -->
    <style>
      :root {
        --color-ivory: #FFF7E8;
        --color-emerald: #17452F;
        --color-gold: #C69A45;
        --color-gold-dark: #A1792B;
        --color-text-dark: #263329;
        --color-text-muted: #4E6053;
      }
      html, body {
        background-color: #FFF7E8;
        color: #263329;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        background-color: #FFF7E8;
        position: relative;
      }
      .pre-shell {
        position: relative;
        min-height: 100vh;
        width: 100%;
        overflow: hidden;
        background-color: #FFF7E8;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .pre-poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
        z-index: 0;
      }
      .pre-overlay-desk {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255, 247, 232, 0.96) 0%, rgba(255, 247, 232, 0.90) 38%, rgba(255, 247, 232, 0.45) 58%, rgba(255, 247, 232, 0.05) 80%, rgba(255, 247, 232, 0) 100%);
        pointer-events: none;
        z-index: 1;
      }
      .pre-overlay-mob {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 247, 232, 0.95) 0%, rgba(255, 247, 232, 0.72) 22%, rgba(255, 247, 232, 0) 38%, rgba(255, 247, 232, 0) 65%, rgba(255, 247, 232, 0.78) 82%, rgba(255, 247, 232, 0.96) 100%);
        pointer-events: none;
        z-index: 1;
        display: none;
      }
      @media (max-width: 860px) {
        .pre-poster {
          object-position: 75% 28% !important;
        }
        .pre-overlay-desk {
          display: none !important;
        }
        .pre-overlay-mob {
          display: block !important;
        }
        .pre-content-wrap {
          text-align: center !important;
          align-items: center !important;
          padding-left: 1.25rem !important;
          padding-right: 1.25rem !important;
        }
        .pre-art-spacer {
          display: block !important;
          height: clamp(180px, 32vh, 270px) !important;
        }
        .pre-pillars {
          justify-content: center !important;
        }
      }
      @keyframes festivePulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .festive-pulse {
        display: inline-block;
        animation: festivePulse 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <!-- Immediate First Paint Shell: Zero blank screen, visible in 0ms before JS downloads -->
    <div id="root">
      <div class="pre-shell">
        <!-- Preloaded High-Res Artwork -->
        <img
          src="/images/ezgif-frame-001.jpg"
          alt="Goddess Saraswathi in traditional courtyard"
          class="pre-poster"
          fetchpriority="high"
        />
        <div class="pre-overlay-desk"></div>
        <div class="pre-overlay-mob"></div>

        <!-- Instant Header -->
        <header style="position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; max-width: 1240px; margin: 0 auto; width: 100%; box-sizing: border-box;">
          <div style="display: flex; align-items: center; gap: 0.65rem;">
            <span style="font-size: 1.35rem;" class="festive-pulse">🪔</span>
            <div>
              <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.25rem; font-weight: 700; color: #17452F; line-height: 1.1;">CSEA</div>
              <div style="font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: #A1792B; font-weight: 600;">PSG College of Technology</div>
            </div>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.85rem; border-radius: 9999px; background: rgba(255,255,255,0.85); border: 1px solid rgba(198,154,69,0.3); font-size: 0.78rem; font-weight: 600; color: #17452F;">
            <span>🪷</span> Saraswathi Pooja
          </div>
        </header>

        <!-- Instant Hero Content -->
        <div class="pre-content-wrap" style="position: relative; z-index: 2; max-width: 1240px; margin: 0 auto; width: 100%; padding: 1.5rem 2rem; flex: 1; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box;">
          <div style="max-width: 680px; display: flex; flex-direction: column;">
            <div style="display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.35rem 0.95rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #17452F; background: rgba(248, 235, 210, 0.95); border: 1px solid #C69A45; width: fit-content; margin-bottom: 0.85rem;">
              <span>🪔</span> WHERE KNOWLEDGE BLOSSOMS
            </div>

            <h1 style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(2.4rem, 5.5vw, 4.8rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: #17452F; margin: 0 0 0.5rem 0;">
              Happy Saraswathi <br />
              <span style="color: #C69A45;">Pooja</span>
            </h1>

            <p style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(1.2rem, 2.4vw, 1.85rem); font-style: italic; font-weight: 500; color: #A1792B; margin: 0 0 0.5rem 0; line-height: 1.35;">
              "Where knowledge blossoms, wisdom leads."
            </p>

            <p style="font-size: clamp(0.92rem, 1.2vw, 1.08rem); color: #4E6053; margin: 0 0 1.5rem 0; max-width: 540px; line-height: 1.55;">
              Celebrating knowledge, creativity, and new beginnings.
            </p>

            <!-- Mobile Art Spacer -->
            <div class="pre-art-spacer" style="display: none;" aria-hidden="true"></div>

            <!-- Core Pillars -->
            <div class="pre-pillars" style="display: flex; flex-wrap: wrap; gap: 0.85rem; margin-bottom: 1.5rem;">
              <div style="padding: 0.55rem 1.15rem; border-radius: 9999px; background: rgba(255, 252, 245, 0.88); border: 1px solid rgba(198, 154, 69, 0.28); font-size: 0.85rem; font-weight: 600; color: #17452F;">
                Learn with Curiosity
              </div>
              <div style="padding: 0.55rem 1.15rem; border-radius: 9999px; background: rgba(255, 252, 245, 0.88); border: 1px solid rgba(198, 154, 69, 0.28); font-size: 0.85rem; font-weight: 600; color: #17452F;">
                Grow with Gratitude
              </div>
              <div style="padding: 0.55rem 1.15rem; border-radius: 9999px; background: rgba(255, 252, 245, 0.88); border: 1px solid rgba(198, 154, 69, 0.28); font-size: 0.85rem; font-weight: 600; color: #17452F;">
                Dream with Courage
              </div>
            </div>
          </div>
        </div>

        <!-- Ambient Loading Badge -->
        <div style="position: relative; z-index: 2; padding: 1rem; text-align: center; font-size: 0.8rem; color: #A1792B; font-weight: 600; letter-spacing: 0.05em;">
          <span class="festive-pulse">🪷</span> Loading Celebration...
        </div>
      </div>
    </div>

    <!-- Main Module Script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
