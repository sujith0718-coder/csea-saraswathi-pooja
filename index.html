<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where Knowledge Blossoms | CSEA Saraswathi Pooja · PSG College of Technology</title>
    <meta
      name="description"
      content="A celebratory digital tribute for Saraswathi Pooja presented by Computer Science and Engineering Association (CSEA), PSG College of Technology. Learn with curiosity. Grow with gratitude. Dream with courage."
    />
    <meta name="theme-color" content="#103624" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Where Knowledge Blossoms | CSEA Saraswathi Pooja · PSG Tech" />
    <meta property="og:description" content="Learn with curiosity. Grow with gratitude. Dream with courage. A tribute to knowledge, wisdom, and new beginnings." />
    <meta property="og:image" content="/images/ezgif-frame-001.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>" />

    <!-- Preload Hero Image so browser fetches it immediately with highest priority -->
    <link rel="preload" as="image" href="/images/ezgif-frame-001.jpg" fetchpriority="high" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Critical instant styling: Sets festive background & splash screen loader -->
    <style>
      html, body {
        background-color: #FFF7E8;
        color: #263329;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
        background-color: #FFF7E8;
      }
      #splash-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #FFF7E8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
      }
      #splash-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 480px;
        width: 100%;
      }
      .splash-diya {
        font-size: 2.8rem;
        margin-bottom: 0.85rem;
        animation: splashGlow 2s ease-in-out infinite;
      }
      .splash-org {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #A1792B;
        margin-bottom: 0.4rem;
      }
      .splash-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(1.8rem, 5.5vw, 2.5rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #17452F;
        margin: 0 0 0.35rem 0;
        line-height: 1.15;
      }
      .splash-tagline {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(1rem, 3vw, 1.25rem);
        font-style: italic;
        color: #C69A45;
        margin: 0 0 1.5rem 0;
      }
      .splash-track {
        width: 160px;
        height: 3px;
        background: rgba(198, 154, 69, 0.25);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #C69A45, #E9A12B, #C69A45);
        border-radius: 9999px;
        animation: splashAnim 1.4s ease-in-out infinite;
      }
      @keyframes splashGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(233,161,43,0.4)); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 20px rgba(244,130,37,0.8)); }
      }
      @keyframes splashAnim {
        0% { left: -45%; width: 35%; }
        50% { width: 55%; }
        100% { left: 100%; width: 35%; }
      }
    </style>
  </head>
  <body>
    <!-- Instant Festive Splash Loader: Renders immediately at 0ms, smooth fade-out on mount -->
    <div id="splash-loader" aria-hidden="true">
      <div class="splash-box">
        <div class="splash-diya">🪔</div>
        <div class="splash-org">CSEA · PSG College of Technology</div>
        <h1 class="splash-title">WHERE KNOWLEDGE BLOSSOMS</h1>
        <p class="splash-tagline">Happy Saraswathi Pooja</p>
        <div class="splash-track">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
